[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobalt-workbench"
version = "1.0.0"
description = "Node.js ESM developer tooling for import cache management, import maps, and package resolution"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
maintainers = [
  {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
keywords = ["nodejs", "esm", "import-maps", "cache", "developer-tools", "ai-ml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Testing",
]
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.0",
  "sqlalchemy==2.0.35",
  "alembic==1.13.2",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "python-multipart==0.0.18",
  "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.23.7",
  "pytest-cov==5.0.0",
  "faker==33.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"